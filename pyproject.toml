[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-router"
version = "0.1.0"
description = "Intelligent AI router for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Stephen Sampson" }
]

dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "PyYAML>=6.0.2",
  "litellm>=1.76.0",
  "structlog>=25.4.0",
  "tenacity>=9.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
  "black>=25.1.0",
  "mypy>=1.17.0"
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "tests"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "app*"
]
