version: '3.8'
services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    volumes:
      - .:/app
    depends_on:
      - litellm

  litellm:
    image: ghcr.io/berriai/litellm:latest
    ports:
      - "4000:4000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
